name: CI

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

jobs:
  tests:
    name: Laravel tests
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: petmingle_test
          MYSQL_USER: petmingle
          MYSQL_PASSWORD: secret
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      APP_ENV: testing
      APP_DEBUG: true

      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: petmingle_test
      DB_USERNAME: petmingle
      DB_PASSWORD: secret

      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync

      MAIL_MAILER: array
      MAIL_FROM_ADDRESS: noreply@petmingle.test
      MAIL_FROM_NAME: PetMingle

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, pdo_mysql, bcmath, gd, zip
          coverage: none
          tools: composer:v2

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare Laravel environment
        run: |
          cp .env.example .env
          php artisan key:generate
          mkdir -p storage/framework/cache/phpstan

      - name: Validate Composer configuration
        run: composer validate --strict

      - name: Check PHP formatting
        run: composer format:test

      - name: Run static analysis
        run: composer analyse

      - name: Run database migrations
        run: php artisan migrate --force

      - name: Check Laravel routes
        run: php artisan route:list > /dev/null

      - name: Run tests
        run: php artisan test

      - name: Composer security audit
        run: composer audit

  frontend:
    name: React typecheck, tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Typecheck frontend
        run: npm run typecheck
      - name: Run frontend tests
        run: npm test -- --maxWorkers=1
      - name: Build frontend
        run: npm run build
