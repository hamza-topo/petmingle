name: CI

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

jobs:
  tests:
    name: Laravel tests
    runs-on: ubuntu-latest

    services:
      mysql:
        image: public.ecr.aws/docker/library/mysql:8.0
        env:
          MYSQL_DATABASE: petmingle_test
          MYSQL_USER: petmingle
          MYSQL_PASSWORD: secret
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      APP_ENV: testing
      APP_DEBUG: true

      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: petmingle_test
      DB_USERNAME: petmingle
      DB_PASSWORD: secret

      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync

      MAIL_MAILER: array
      MAIL_FROM_ADDRESS: noreply@petmingle.test
      MAIL_FROM_NAME: PetMingle

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, pdo_mysql, bcmath, gd, zip
          coverage: none
          tools: composer:v2

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare Laravel environment
        run: |
          cp .env.example .env
          php artisan key:generate
          mkdir -p storage/framework/cache/phpstan

      - name: Validate Composer configuration
        run: composer validate --strict

      - name: Check PHP formatting
        run: composer format:test

      - name: Run static analysis
        run: composer analyse

      - name: Run database migrations
        run: php artisan migrate --force

      - name: Check Laravel routes
        run: php artisan route:list > /dev/null

      - name: Run tests
        run: php artisan test

      - name: Composer security audit
        run: composer audit

  frontend:
    name: React typecheck, tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Validate root frontend forwarding manifest
        run: |
          npm --prefix .. ci --ignore-scripts
          npm --prefix .. run typecheck
      - name: Prepare official Node image for Compose
        run: |
          docker pull public.ecr.aws/docker/library/node:24-alpine
          docker tag public.ecr.aws/docker/library/node:24-alpine node:24-alpine
      - name: Verify Docker Compose frontend service
        run: |
          docker compose -f ../docker-compose.yml --profile frontend config --quiet
          docker compose -f ../docker-compose.yml --profile frontend run --rm --no-deps node sh -c 'npm ci && npm run typecheck'
      - name: Run frontend tests
        run: npm test -- --maxWorkers=1
      - name: Check public build configuration
        run: node --test scripts/build-environment.check.mjs
      - name: Build frontend
        env:
          VITE_API_BASE_URL: http://127.0.0.1:4173/api/v.0
          VITE_MEDIA_BASE_URL: http://127.0.0.1:4173
        run: npm run build -- --mode desktop-review
      - name: Install desktop browser tooling
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Review desktop layouts
        run: node scripts/desktop-review.mjs
      - name: Upload desktop review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-review
          path: frontend/desktop-review
          retention-days: 14

      - name: Build deployment bundle
        env:
          VITE_API_BASE_URL: https://api.petmingle.test/api/v.0
          VITE_MEDIA_BASE_URL: https://api.petmingle.test
          VITE_REALTIME_ENABLED: 'false'
        run: docker build --build-arg NODE_IMAGE=public.ecr.aws/docker/library/node:24-alpine --build-arg NGINX_IMAGE=public.ecr.aws/docker/library/nginx:stable-alpine --build-arg VITE_API_BASE_URL --build-arg VITE_MEDIA_BASE_URL --build-arg VITE_REALTIME_ENABLED -t petmingle-frontend:ci .
      - name: Verify production static hosting
        run: |
          docker run --detach --name petmingle-frontend-smoke -p 8088:8080 petmingle-frontend:ci
          trap 'docker rm -f petmingle-frontend-smoke' EXIT
          for attempt in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8088/index.html >/dev/null && break
            sleep 1
          done
          node scripts/hosting-smoke.mjs
