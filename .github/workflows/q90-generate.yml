name: Q90 dependency generation

on:
  push:
    branches:
      - quality/90-pint-phpstan-gates

permissions:
  contents: write

concurrency:
  group: q90-dependency-generation
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, bcmath, gd, zip, xml
          coverage: none
          tools: composer:v2

      - name: Resolve quality dependencies
        run: |
          composer update laravel/pint larastan/larastan --with-dependencies --no-interaction --no-progress --no-scripts

      - name: Prepare app for Larastan
        run: |
          cp .env.example .env
          php artisan key:generate
          mkdir -p storage/framework/cache/phpstan

      - name: Lint application PHP
        run: |
          find app -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Generate PHPStan baseline
        run: |
          printf 'parameters:\n    ignoreErrors: []\n' > phpstan-baseline.neon
          vendor/bin/phpstan analyse --generate-baseline=phpstan-baseline.neon --memory-limit=1G

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add composer.lock phpstan-baseline.neon
          if git diff --cached --quiet; then
            echo "Generated files are already stable."
            exit 0
          fi
          git commit -m "build(quality): lock Pint and Larastan baseline"
          git push origin HEAD:quality/90-pint-phpstan-gates
