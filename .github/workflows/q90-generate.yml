name: Q90 dependency generation

on:
  push:
    branches:
      - quality/90-pint-phpstan-gates

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, bcmath, gd, zip, xml
          coverage: none
          tools: composer:v2

      - name: Resolve quality dependencies
        run: |
          composer update laravel/pint larastan/larastan --with-dependencies --no-interaction --no-progress --no-scripts

      - name: Prepare app for Larastan
        run: |
          cp .env.example .env
          php artisan key:generate || true
          mkdir -p storage/framework/cache

      - name: Lint application PHP
        run: |
          find app -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Generate PHPStan baseline
        run: |
          printf 'parameters:\n    ignoreErrors: []\n' > phpstan-baseline.neon
          vendor/bin/phpstan analyse --generate-baseline=phpstan-baseline.neon --memory-limit=1G

      - name: Upload generated files
        uses: actions/upload-artifact@v4
        with:
          name: q90-generated
          path: |
            composer.lock
            phpstan-baseline.neon
          if-no-files-found: error
